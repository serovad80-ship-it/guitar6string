  { r: 1, s: 1, f: 0, n: "E4" },

];

const openFreqs = [329.63, 246.94, 196.00, 146.83, 110.00, 82.41];

const fretX = [30];
const nutX = 65;
fretX.push(nutX);
const totalFretWidth = 920;
for (let i = 1; i <= 9; i++) {
  fretX.push(nutX + (i * (totalFretWidth / 9)));
}

function getFretX(f) {
  if (f === 0) return 30;
  return (fretX[f] + fretX[f + 1]) / 2;
}

function buildFretboard() {
  const fretsG = document.getElementById("frets");
  const inlaysG = document.getElementById("inlays");
  const stringsG = document.getElementById("strings");
  const fLabelsG = document.getElementById("fret-labels");
  const sLabelsG = document.getElementById("string-labels");

  fretsG.innerHTML = ""; inlaysG.innerHTML = ""; stringsG.innerHTML = "";
  fLabelsG.innerHTML = ""; sLabelsG.innerHTML = "";

  const nut = document.createElementNS("http://www.w3.org/2000/svg", "line");
  nut.setAttribute("x1", fretX[1]); nut.setAttribute("y1", "20");
  nut.setAttribute("x2", fretX[1]); nut.setAttribute("y2", "170");
  nut.setAttribute("stroke", "#111"); nut.setAttribute("stroke-width", "6");
  fretsG.appendChild(nut);

  for (let i = 2; i <= 10; i++) {
    const fl = document.createElementNS("http://www.w3.org/2000/svg", "line");
    fl.setAttribute("x1", fretX[i]); fl.setAttribute("y1", "20");
    fl.setAttribute("x2", fretX[i]); fl.setAttribute("y2", "170");
    fl.setAttribute("stroke", "#777"); fl.setAttribute("stroke-width", "2.8");
    fretsG.appendChild(fl);
  }

  [3, 5, 7, 9].forEach(f => {
    const cx = (fretX[f] + fretX[f + 1]) / 2;
    const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    c.setAttribute("cx", cx); c.setAttribute("cy", "95");
    c.setAttribute("r", "5.5"); c.setAttribute("fill", "#ddd");
    inlaysG.appendChild(c);
  });

  const sWidths = [1.2, 1.5, 1.8, 2.2, 2.6, 3.2];
  for (let s = 1; s <= 6; s++) {
    const y = 20 + (s - 1) * 30;
    const sl = document.createElementNS("http://www.w3.org/2000/svg", "line");
    sl.setAttribute("x1", fretX[1]); sl.setAttribute("y1", y);
    sl.setAttribute("x2", fretX[10]); sl.setAttribute("y2", y);
    sl.setAttribute("stroke-width", sWidths[s - 1]);
    stringsG.appendChild(sl);
  }

  for (let f = 0; f <= 9; f++) {
    const tx = getFretX(f);
    const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
    t.setAttribute("x", tx); t.setAttribute("y", "198");
    t.setAttribute("fill", "#333"); t.setAttribute("font-size", "13");
    t.setAttribute("font-weight", "bold");
    t.setAttribute("text-anchor", "middle");
    t.textContent = f === 0 ? "0 лад" : `${f} лад`;
    fLabelsG.appendChild(t);
  }

  const sNames = ["1 (e)", "2 (B)", "3 (G)", "4 (D)", "5 (A)", "6 (E)"];
  sNames.forEach((name, i) => {
    const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
    t.setAttribute("x", "-40"); t.setAttribute("y", 24 + i * 30);
    t.textContent = name;
    sLabelsG.appendChild(t);
  });
}

buildFretboard();

let playAllMode = false;
let playQueue = [];
let playCursor = 0;
let isPlaying = false;
let isPaused = false;
let loop = false;
let actx = null;
let tm = null;

function renderTabs() {
  const grp = document.getElementById("tab-render");
  grp.innerHTML = "";
  const startX = 20;
  const stepX = (940 / exercise.length);

  exercise.forEach((st, i) => {
    const x = startX + i * stepX;
    const tabY = 15 + (st.s - 1) * 15;

    if (i > 0 && i % 5 === 0) {
      const barTab = document.createElementNS("http://www.w3.org/2000/svg", "line");
      barTab.setAttribute("x1", x - (stepX / 2)); barTab.setAttribute("x2", x - (stepX / 2));
      barTab.setAttribute("y1", 10); barTab.setAttribute("y2", 95);
      barTab.setAttribute("stroke", "#4a69bd"); barTab.setAttribute("stroke-width", "2");
      grp.appendChild(barTab);
    }

    if (i % 5 === 0) {
      const rowLbl = document.createElementNS("http://www.w3.org/2000/svg", "text");
      rowLbl.setAttribute("x", x); rowLbl.setAttribute("y", 4);
      rowLbl.setAttribute("fill", "#ff5252"); rowLbl.setAttribute("font-size", "11");
      rowLbl.setAttribute("font-weight", "bold");
      rowLbl.textContent = `Стр.${st.r}`;
      grp.appendChild(rowLbl);
    }

    const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
    t.setAttribute("x", x); t.setAttribute("y", tabY + 4);
    t.setAttribute("text-anchor", "middle"); t.setAttribute("font-size", "11");
    t.setAttribute("font-weight", "bold"); t.setAttribute("fill", "#444");
    t.setAttribute("id", `tb-${i}`); t.textContent = st.f;
    grp.appendChild(t);
  });
}

renderTabs();

function renderFretboardForRow(rowNum) {
  const dotsG = document.getElementById("dots");
  dotsG.innerHTML = "";
  document.getElementById("fretTitle").textContent = `Аппликатура строки ${rowNum} (только её 5 нот)`;

  const rowNotes = exercise.filter(item => item.r === rowNum);
  const seen = new Set();

  rowNotes.forEach(item => {
    const key = `${item.s}-${item.f}`;
    if (!seen.has(key)) {
      seen.add(key);
      const cx = getFretX(item.f);
      const cy = 20 + (item.s - 1) * 30;

      const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
      const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      circle.setAttribute("id", `f-${key}`);
      circle.setAttribute("cx", cx); circle.setAttribute("cy", cy); circle.setAttribute("r", "10");
      circle.setAttribute("fill", item.f === 0 ? "white" : "#ff5252");
      circle.setAttribute("stroke", "#333"); circle.setAttribute("stroke-width", "2");
      g.appendChild(circle);

      if (item.f > 0) {
        const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
        text.setAttribute("x", cx); text.setAttribute("y", cy + 4);
        text.setAttribute("fill", "white"); text.setAttribute("font-size", "11");
        text.setAttribute("font-weight", "bold"); text.setAttribute("text-anchor", "middle");
        text.textContent = item.f;
        g.appendChild(text);
      }
      dotsG.appendChild(g);
    }
  });
}

function playAcousticGuitar(s, f, durSec) {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === "suspended") actx.resume();

  const freq = openFreqs[s - 1] * Math.pow(2, f / 12);
  const now = actx.currentTime;

  const osc1 = actx.createOscillator();
  osc1.type = "triangle";
  osc1.frequency.setValueAtTime(freq, now);

  const osc2 = actx.createOscillator();
  osc2.type = "sawtooth";
  osc2.frequency.setValueAtTime(freq * 2, now);

  const filter = actx.createBiquadFilter();
  filter.type = "lowpass";
  filter.frequency.setValueAtTime(2600, now);
  filter.frequency.exponentialRampToValueAtTime(320, now + durSec);

  const gain = actx.createGain();
  const osc2Gain = actx.createGain();
  osc2Gain.gain.setValueAtTime(0.18, now);

  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.linearRampToValueAtTime(0.42, now + 0.008);
  gain.gain.exponentialRampToValueAtTime(0.001, now + durSec);

  osc1.connect(gain);
  osc2.connect(osc2Gain);
  osc2Gain.connect(gain);
  gain.connect(filter);
  filter.connect(actx.destination);

  osc1.start(now);
  osc2.start(now);
  osc1.stop(now + durSec);
  osc2.stop(now + durSec);
}

function clearHighlights() {
  document.querySelectorAll(".active-fret, .active-tab").forEach(e => {
    e.classList.remove("active-fret", "active-tab");
  });
}

function pulse() {
  if (playCursor >= playQueue.length) {
    if (loop) {
      playCursor = 0;
    } else {
      stop();
      return;
    }
  }

  clearHighlights();
  const noteIdx = playQueue[playCursor];
  const cur = exercise[noteIdx];

  if (cur.r !== selectedRow) {
    selectedRow = cur.r;
    renderFretboardForRow(selectedRow);
    document.querySelectorAll(".btn-row").forEach((btn, idx) => {
      btn.classList.toggle("active", idx + 1 === selectedRow);
    });
  }

  const fEl = document.getElementById(`f-${cur.s}-${cur.f}`);
  if (fEl) fEl.classList.add("active-fret");

  const tEl = document.getElementById(`tb-${noteIdx}`);
  if (tEl) tEl.classList.add("active-tab");

  document.getElementById("status").textContent = `Строка ${cur.r}: ${cur.s} струна, ${cur.f} лад (${cur.n})`;
  playAcousticGuitar(cur.s, cur.f, 0.65);
  playCursor++;

  const ms = parseInt(document.getElementById("speed").value);
  tm = setTimeout(pulse, ms);
}

function startQueue(isAll) {
  stop();
  playAllMode = isAll;
  playQueue = [];

  if (isAll) {
    for (let i = 0; i < exercise.length; i++) playQueue.push(i);
    document.getElementById("playAllBtn").classList.add("active");
  } else {
    const start = (selectedRow - 1) * 5;
    for (let i = start; i < start + 5; i++) playQueue.push(i);
    renderFretboardForRow(selectedRow);
  }

  isPlaying = true;
  isPaused = false;
  playCursor = 0;
  document.getElementById("status").textContent = isAll ? "Воспроизведение (все строки)..." : `Воспроизведение (строка ${selectedRow})...`;
  pulse();
}

function play() {
  if (isPlaying && !isPaused) return;
  if (isPaused) {
    isPaused = false;
    document.getElementById("status").textContent = playAllMode ? "Воспроизведение (все строки)..." : `Воспроизведение (строка ${selectedRow})...`;
    pulse();
    return;
  }
  startQueue(false);
}

function pause() {
  if (!isPlaying || isPaused) return;
  clearTimeout(tm);
  tm = null;
  isPaused = true;
  document.getElementById("status").textContent = "Пауза";
}

function stop() {
  clearTimeout(tm);
  tm = null;
  isPlaying = false;
  isPaused = false;
  playCursor = 0;
  clearHighlights();
  document.getElementById("playAllBtn").classList.remove("active");
  document.getElementById("status").textContent = `Остановлено (Строка ${selectedRow})`;
}

function selectRow(r) {
  stop();
  selectedRow = r;
  document.querySelectorAll(".btn-row").forEach((btn, idx) => {
    btn.classList.toggle("active", idx + 1 === r);
  });
  renderFretboardForRow(r);
  document.getElementById("status").textContent = `Строка ${r} готова`;
}

document.getElementById("playBtn").onclick = play;
document.getElementById("playAllBtn").onclick = () => startQueue(true);
document.getElementById("pauseBtn").onclick = pause;
document.getElementById("stopBtn").onclick = stop;

document.getElementById("loopBtn").onclick = function() {
  loop = !loop;
  this.classList.toggle("active", loop);
  this.textContent = loop ? "🔁 Повтор: Вкл" : "🔁 Повтор: Выкл";
};

document.getElementById("speed").oninput = (e) => {
  document.getElementById("msVal").textContent = e.target.value;
};

selectRow(1);
</script>
