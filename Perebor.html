<script>
const openFreqs = [329.63, 246.94, 196.00, 146.83, 110.00, 82.41];

const openChords = {
  "Am": { 1: 0, 2: 1, 3: 2, 4: 2, 5: 0, 6: null },
  "Dm": { 1: 1, 2: 3, 3: 2, 4: 0, 5: null, 6: null },
  "E":  { 1: 0, 2: 0, 3: 1, 4: 2, 5: 2, 6: 0 }
};

const barreChords = {
  "Amv5": { 1: 5, 2: 5, 3: 5, 4: 7, 5: 7, 6: 5 },
  "Dmv5": { 1: 5, 2: 6, 3: 7, 4: 7, 5: 5, 6: null },
  "Ev7":  { 1: 7, 2: 9, 3: 9, 4: 9, 5: 7, 6: null }
};

const pattern12 = [5, 3, 2, 1, 2, 3, 4, 3, 2, 1, 2, 3];
const patternDm12 = [4, 3, 2, 1, 2, 3, 5, 3, 2, 1, 2, 3];
const patternE12  = [6, 3, 2, 1, 2, 3, 4, 3, 2, 1, 2, 3];
const pattern6_Am = [5, 3, 2, 1, 2, 3];
const pattern6_E  = [6, 3, 2, 1, 2, 3];

const patternAmv5_12 = [6, 3, 2, 1, 2, 3, 5, 3, 2, 1, 2, 3];
const patternDmv5_12 = [5, 3, 2, 1, 2, 3, 4, 3, 2, 1, 2, 3];
const patternEv7_12  = [5, 3, 2, 1, 2, 3, 4, 3, 2, 1, 2, 3];
const patternAmv5_6  = [6, 3, 2, 1, 2, 3];
const patternEv7_6   = [5, 3, 2, 1, 2, 3];

function buildSequence(mode) {
  const seq = [];
  if (mode === 1) {
    const blocks = [
      { name: "Am", p: pattern12 },
      { name: "Dm", p: patternDm12 },
      { name: "E",  p: patternE12 },
      { name: "Am", p: pattern6_Am },
      { name: "E",  p: pattern6_E }
    ];
    blocks.forEach((b, bIdx) => {
      const chord = openChords[b.name];
      b.p.forEach(str => {
        seq.push({ block: bIdx + 1, chordName: b.name, s: str, f: chord[str], chordObj: chord });
      });
    });
  } else {
    const blocks = [
      { name: "Amv5", p: patternAmv5_12 },
      { name: "Dmv5", p: patternDmv5_12 },
      { name: "Ev7",  p: patternEv7_12 },
      { name: "Amv5", p: patternAmv5_6 },
      { name: "Ev7",  p: patternEv7_6 }
    ];
    blocks.forEach((b, bIdx) => {
      const chord = barreChords[b.name];
      b.p.forEach(str => {
        seq.push({ block: bIdx + 1, chordName: b.name, s: str, f: chord[str], chordObj: chord });
      });
    });
  }
  return seq;
}

const fretX = [30];
const nutX = 65;
fretX.push(nutX);
const totalFretWidth = 920;
for (let i = 1; i <= 9; i++) {
  fretX.push(nutX + (i * (totalFretWidth / 9)));
}

function getFretX(f) {
  if (f === 0) return 30;
  return (fretX[f] + fretX[f + 1]) / 2;
}

function buildFretboard() {
  const fretsG = document.getElementById("frets");
  const inlaysG = document.getElementById("inlays");
  const stringsG = document.getElementById("strings");
  const fLabelsG = document.getElementById("fret-labels");
  const sLabelsG = document.getElementById("string-labels");

  fretsG.innerHTML = ""; inlaysG.innerHTML = ""; stringsG.innerHTML = "";
  fLabelsG.innerHTML = ""; sLabelsG.innerHTML = "";

  const nut = document.createElementNS("http://www.w3.org/2000/svg", "line");
  nut.setAttribute("x1", fretX[1]); nut.setAttribute("y1", "20");
  nut.setAttribute("x2", fretX[1]); nut.setAttribute("y2", "170");
  nut.setAttribute("stroke", "#111"); nut.setAttribute("stroke-width", "6");
  fretsG.appendChild(nut);

  for (let i = 2; i <= 10; i++) {
    const fl = document.createElementNS("http://www.w3.org/2000/svg", "line");
    fl.setAttribute("x1", fretX[i]); fl.setAttribute("y1", "20");
    fl.setAttribute("x2", fretX[i]); fl.setAttribute("y2", "170");
    fl.setAttribute("stroke", "#777"); fl.setAttribute("stroke-width", "2.8");
    fretsG.appendChild(fl);
  }

  [3, 5, 7, 9].forEach(f => {
    const cx = (fretX[f] + fretX[f + 1]) / 2;
    const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    c.setAttribute("cx", cx); c.setAttribute("cy", "95");
    c.setAttribute("r", "5.5"); c.setAttribute("fill", "#ddd");
    inlaysG.appendChild(c);
  });

  const sWidths = [1.2, 1.5, 1.8, 2.2, 2.6, 3.2];
  for (let s = 1; s <= 6; s++) {
    const y = 20 + (s - 1) * 30;
    const sl = document.createElementNS("http://www.w3.org/2000/svg", "line");
    sl.setAttribute("x1", fretX[1]); sl.setAttribute("y1", y);
    sl.setAttribute("x2", fretX[10]); sl.setAttribute("y2", y);
    sl.setAttribute("stroke-width", sWidths[s - 1]);
    stringsG.appendChild(sl);
  }

  for (let f = 0; f <= 9; f++) {
    const tx = getFretX(f);
    const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
    t.setAttribute("x", tx); t.setAttribute("y", "198");
    t.setAttribute("fill", "#333"); t.setAttribute("font-size", "13");
    t.setAttribute("font-weight", "bold");
    t.setAttribute("text-anchor", "middle");
    t.textContent = f === 0 ? "0 лад" : `${f} лад`;
    fLabelsG.appendChild(t);
  }

  const sNames = ["1 (e)", "2 (B)", "3 (G)", "4 (D)", "5 (A)", "6 (E)"];
  sNames.forEach((name, i) => {
    const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
    t.setAttribute("x", "-40"); t.setAttribute("y", 24 + i * 30);
    t.textContent = name;
    sLabelsG.appendChild(t);
  });
}

buildFretboard();

let curMode = 1;
let currentSeq = buildSequence(1);
let currentChordName = "";
let actx = null;
let tm = null;
let playCursor = 0;
let isPlaying = false;
let isPaused = false;
let loop = false;

function playAcousticGuitar(s, f, durSec) {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === "suspended") actx.resume();

  const freq = openFreqs[s - 1] * Math.pow(2, f / 12);
  const now = actx.currentTime;

  const osc1 = actx.createOscillator();
  osc1.type = "triangle";
  osc1.frequency.setValueAtTime(freq, now);

  const osc2 = actx.createOscillator();
  osc2.type = "sawtooth";
  osc2.frequency.setValueAtTime(freq * 2, now);

  const filter = actx.createBiquadFilter();
  filter.type = "lowpass";
  filter.frequency.setValueAtTime(2600, now);
  filter.frequency.exponentialRampToValueAtTime(320, now + durSec);

  const gain = actx.createGain();
  const osc2Gain = actx.createGain();
  osc2Gain.gain.setValueAtTime(0.18, now);

  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.linearRampToValueAtTime(0.42, now + 0.008);
  gain.gain.exponentialRampToValueAtTime(0.001, now + durSec);

  osc1.connect(gain);
  osc2.connect(osc2Gain);
  osc2Gain.connect(gain);
  gain.connect(filter);
  filter.connect(actx.destination);

  osc1.start(now);
  osc2.start(now);
  osc1.stop(now + durSec);
  osc2.stop(now + durSec);
}

function renderChordFretboard(chordName, chordObj) {
  if (currentChordName === chordName) return;
  currentChordName = chordName;

  document.getElementById("fretTitle").textContent = `Аппликатура аккорда: ${chordName}`;
  const dotsG = document.getElementById("dots");
  dotsG.innerHTML = "";

  for (let s = 1; s <= 6; s++) {
    const f = chordObj[s];
    if (f === null || f === undefined) continue;

    const cx = getFretX(f);
    const cy = 20 + (s - 1) * 30;

    const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
    const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    circle.setAttribute("id", `f-${s}-${f}`);
    circle.setAttribute("cx", cx); circle.setAttribute("cy", cy); circle.setAttribute("r", "10");
    circle.setAttribute("fill", f === 0 ? "white" : "#ff5252");
    circle.setAttribute("stroke", "#333"); circle.setAttribute("stroke-width", "2");
    g.appendChild(circle);

    if (f > 0) {
      const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
      text.setAttribute("x", cx); text.setAttribute("y", cy + 4);
      text.setAttribute("fill", "white"); text.setAttribute("font-size", "11");
      text.setAttribute("font-weight", "bold"); text.setAttribute("text-anchor", "middle");
      text.textContent = f;
      g.appendChild(text);
    }
    dotsG.appendChild(g);
  }
}

function renderTab() {
  const grp = document.getElementById("tab-render");
  grp.innerHTML = "";

  const startX = 20;
  const stepX = (940 / currentSeq.length);

  currentSeq.forEach((st, i) => {
    const x = startX + i * stepX;
    const tabY = 15 + (st.s - 1) * 15;

    if (i === 12 || i === 24 || i === 36 || i === 42) {
      const bar = document.createElementNS("http://www.w3.org/2000/svg", "line");
      bar.setAttribute("x1", x - (stepX / 2)); bar.setAttribute("x2", x - (stepX / 2));
      bar.setAttribute("y1", 10); bar.setAttribute("y2", 95);
      bar.setAttribute("stroke", "#4a69bd"); bar.setAttribute("stroke-width", "2");
      grp.appendChild(bar);
    }

    if (i === 0 || i === 12 || i === 24 || i === 36 || i === 42) {
      const chordLbl = document.createElementNS("http://www.w3.org/2000/svg", "text");
      chordLbl.setAttribute("x", x); chordLbl.setAttribute("y", 4);
      chordLbl.setAttribute("fill", "#ff5252"); chordLbl.setAttribute("font-size", "12");
      chordLbl.setAttribute("font-weight", "bold");
      chordLbl.textContent = st.chordName;
      grp.appendChild(chordLbl);
    }

    const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
    t.setAttribute("x", x); t.setAttribute("y", tabY + 4);
    t.setAttribute("text-anchor", "middle"); t.setAttribute("font-size", "11");
    t.setAttribute("font-weight", "bold");
    t.setAttribute("fill", "#444");
    t.setAttribute("id", `tb-${i}`);
    t.textContent = st.f;
    grp.appendChild(t);
  });
}

function clearActive() {
  document.querySelectorAll(".active-fret, .active-tab").forEach(e => {
    e.classList.remove("active-fret", "active-tab");
  });
}

function pulse() {
  if (playCursor >= currentSeq.length) {
    if (loop) {
      playCursor = 0;
    } else {
      stop();
      return;
    }
  }

  clearActive();
  const cur = currentSeq[playCursor];

  renderChordFretboard(cur.chordName, cur.chordObj);

  const fEl = document.getElementById(`f-${cur.s}-${cur.f}`);
  if (fEl) fEl.classList.add("active-fret");

  const tEl = document.getElementById(`tb-${playCursor}`);
  if (tEl) tEl.classList.add("active-tab");

  document.getElementById("status").textContent = `${cur.chordName} • ${cur.s}-я струна (${cur.f} лад)`;

  playAcousticGuitar(cur.s, cur.f, 0.65);
  playCursor++;

  const ms = parseInt(document.getElementById("speed").value);
  tm = setTimeout(pulse, ms);
}

function play() {
  if (isPlaying && !isPaused) return;
  isPlaying = true;
  isPaused = false;
  document.getElementById("status").textContent = `Воспроизведение (Режим ${curMode})...`;
  pulse();
}

function pause() {
  if (!isPlaying || isPaused) return;
  clearTimeout(tm);
  tm = null;
  isPaused = true;
  document.getElementById("status").textContent = "Пауза";
}

function stop() {
  clearTimeout(tm);
  tm = null;
  isPlaying = false;
  isPaused = false;
  playCursor = 0;
  clearActive();
  document.getElementById("status").textContent = `Остановлено (Режим ${curMode})`;
}

function setMode(m) {
  stop();
  curMode = m;
  document.querySelectorAll(".btn-mode").forEach((btn, i) => btn.classList.toggle("active", i + 1 === m));
  currentSeq = buildSequence(m);
  currentChordName = "";
  renderChordFretboard(currentSeq[0].chordName, currentSeq[0].chordObj);
  renderTab();
  document.getElementById("status").textContent = `Режим ${m} готов к игре`;
}

document.getElementById("playBtn").onclick = play;
document.getElementById("pauseBtn").onclick = pause;
document.getElementById("stopBtn").onclick = stop;

document.getElementById("loopBtn").onclick = function() {
  loop = !loop;
  this.classList.toggle("active", loop);
  this.textContent = loop ? "🔁 Повтор: Вкл" : "🔁 Повтор: Выкл";
};

document.getElementById("speed").oninput = (e) => {
  document.getElementById("msVal").textContent = e.target.value;
};

document.getElementById("mode1Btn").onclick = () => setMode(1);
document.getElementById("mode2Btn").onclick = () => setMode(2);

setMode(1);
</script>
