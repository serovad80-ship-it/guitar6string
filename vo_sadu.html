<script>
const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs, text) => {
  const node = document.createElementNS(NS, tag);
  for (const k in attrs) node.setAttribute(k, attrs[k]);
  if (text !== undefined) node.textContent = text;
  return node;
};

// Исходная табулатура (4 такта по 16 шагов)
const rawTab = [
  "e||1-1-0-0-------0-|1-1-0-0---------|----------------|----------------|",
  "B||--------3-3-3---|--------3---3---|1-1-0-0-------0-|1-1-0-0---------|",
  "G||----------------|----------------|--------2-2-2---|--------2---2---|",
  "D||0-------0---0---|0-------0-------|----------------|----------------|",
  "A||----0-----------|----0-----------|0-------0---0---|0-------0-------|",
  "E||----------------|----------------|----0-----------|----0-----------|"
];

const getFretX = f => f === 0 ? 30 : 65 + (f - 0.5) * 184;

(() => {
  const fretsG = document.getElementById("frets");
  const inlaysG = document.getElementById("inlays");
  const stringsG = document.getElementById("strings");
  const fLabelsG = document.getElementById("fret-labels");
  const sLabelsG = document.getElementById("string-labels");

  for (let i = 0; i <= 5; i++) {
    const x = 65 + i * 184;
    fretsG.appendChild(el("line", { x1: x, y1: 20, x2: x, y2: 170, stroke: i === 0 ? "#111" : "#777", "stroke-width": i === 0 ? 6 : 2.8 }));
    fLabelsG.appendChild(el("text", { x: getFretX(i), y: 198, fill: "#333", "font-size": 13, "font-weight": "bold", "text-anchor": "middle" }, i === 0 ? "0 лад" : `${i} лад`));
  }

  [3, 5].forEach(f => inlaysG.appendChild(el("circle", { cx: getFretX(f), cy: 95, r: 5.5, fill: "#ddd" })));

  const sNames = ["1 (e)", "2 (B)", "3 (G)", "4 (D)", "5 (A)", "6 (E)"];
  const sWidths = [1.2, 1.5, 1.8, 2.2, 2.6, 3.2];
  for (let s = 1; s <= 6; s++) {
    const y = 20 + (s - 1) * 30;
    stringsG.appendChild(el("line", { x1: 65, y1: y, x2: 985, y2: y, "stroke-width": sWidths[s - 1] }));
    sLabelsG.appendChild(el("text", { x: -40, y: y + 4 }, sNames[s - 1]));
  }
})();

const timeline = [];

(() => {
  const gridG = document.getElementById("tab-grid");
  const notesG = document.getElementById("tab-notes");
  const topY = 16, rowH = 18, width = 980, bottomY = topY + rowH * 5;
  const sLabels = ["e", "B", "G", "D", "A", "E"];

  for (let i = 0; i < 6; i++) {
    const y = topY + i * rowH;
    gridG.appendChild(el("text", { x: -36, y: y + 4, fill: "#333", "font-size": 12, "font-weight": "bold" }, sLabels[i]));
    gridG.appendChild(el("line", { x1: 0, y1: y, x2: width, y2: y, stroke: "#bbb", "stroke-width": 1.3 }));
  }

  const len = rawTab[0].length;
  const cols = [];
  let barIdx = 0;

  for (let c = 3; c < len; c++) {
    if (rawTab[0][c] === '|') {
      cols.push({ type: 'bar', idx: barIdx++ });
    } else {
      const notes = [];
      for (let s = 0; s < 6; s++) {
        const ch = rawTab[s][c];
        if (ch >= '0' && ch <= '9') notes.push({ s: s + 1, f: parseInt(ch) });
      }
      cols.push({ type: 'step', notes });
    }
  }

  const totalSteps = cols.filter(x => x.type === 'step').length;
  const stepW = width / totalSteps;
  let stepCounter = 0;

  gridG.appendChild(el("line", { x1: 0, y1: topY - 4, x2: 0, y2: bottomY + 4, stroke: "#4a69bd", "stroke-width": 3 }));
  gridG.appendChild(el("text", { x: 6, y: 2, fill: "#ff5252", "font-size": 11, "font-weight": "bold" }, "Такт 1"));

  cols.forEach(item => {
    if (item.type === 'bar') {
      const bx = stepCounter * stepW;
      const isLast = bx >= width - 1;
      gridG.appendChild(el("line", { x1: bx, y1: topY - 4, x2: bx, y2: bottomY + 4, stroke: isLast ? "#111" : "#4a69bd", "stroke-width": isLast ? 3.5 : 2 }));
      if (!isLast) {
        gridG.appendChild(el("text", { x: bx + 6, y: 2, fill: "#ff5252", "font-size": 11, "font-weight": "bold" }, `Такт ${item.idx + 2}`));
      }
    } else {
      const nx = (stepCounter + 0.5) * stepW;
      const stepNotes = item.notes.map((n, nIdx) => {
        activeDots.add(`${n.s}-${n.f}`);
        const ny = topY + (n.s - 1) * rowH;
        const bgId = `tbg-${stepCounter}-${nIdx}`;
        const txtId = `ttxt-${stepCounter}-${nIdx}`;

        notesG.appendChild(el("rect", { id: bgId, x: nx - 8, y: ny - 8, width: 16, height: 16, rx: 4, fill: "#ffffff", opacity: 0.94 }));
        notesG.appendChild(el("text", { id: txtId, x: nx, y: ny + 4, fill: "#111", "font-size": 12, "font-weight": "bold", "text-anchor": "middle" }, n.f));

        return { s: n.s, f: n.f, bgId, txtId };
      });
      timeline.push(stepNotes);
      stepCounter++;
    }
  });
})();

const dotsG = document.getElementById("dots");
activeDots.forEach(key => {
  const [s, f] = key.split("-").map(Number);
  const cx = getFretX(f), cy = 20 + (s - 1) * 30;
  dotsG.appendChild(el("circle", { id: `f-${s}-${f}`, cx, cy, r: 10, fill: f === 0 ? "white" : "#ff5252", stroke: "#333", "stroke-width": 2 }));
  if (f > 0) dotsG.appendChild(el("text", { x: cx, y: cy + 4, fill: "white", "font-size": 11, "font-weight": "bold", "text-anchor": "middle" }, f));
});

const openFreqs = [329.63, 246.94, 196.00, 146.83, 110.00, 82.41];
let actx = null, tm = null, cursor = 0, playing = false, paused = false, loop = false;

function playTone(s, f, dur) {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === "suspended") actx.resume();
  const freq = openFreqs[s - 1] * Math.pow(2, f / 12);
  const now = actx.currentTime;

  const osc1 = actx.createOscillator(), osc2 = actx.createOscillator();
  osc1.type = "triangle"; osc1.frequency.setValueAtTime(freq, now);
  osc2.type = "sawtooth"; osc2.frequency.setValueAtTime(freq * 2, now);

  const filter = actx.createBiquadFilter();
  filter.type = "lowpass";
  filter.frequency.setValueAtTime(2600, now);
  filter.frequency.exponentialRampToValueAtTime(320, now + dur);

  const gain = actx.createGain(), osc2Gain = actx.createGain();
  osc2Gain.gain.setValueAtTime(0.18, now);
  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.linearRampToValueAtTime(0.42, now + 0.008);
  gain.gain.exponentialRampToValueAtTime(0.001, now + dur);

  osc1.connect(gain); osc2.connect(osc2Gain); osc2Gain.connect(gain);
  gain.connect(filter); filter.connect(actx.destination);
  osc1.start(now); osc2.start(now); osc1.stop(now + dur); osc2.stop(now + dur);
}

function clearActive() {
  document.querySelectorAll(".active-fret").forEach(e => e.classList.remove("active-fret"));
  document.querySelectorAll(".tab-active-bg").forEach(e => e.classList.remove("tab-active-bg"));
  document.querySelectorAll(".tab-active-txt").forEach(e => e.classList.remove("tab-active-txt"));
}

function pulse() {
  if (cursor >= timeline.length) {
    if (loop) cursor = 0;
    else { stop(); return; }
  }

  const notes = timeline[cursor];
  if (notes.length > 0) {
    clearActive();
    const dur = notes.length > 1 ? 0.85 : 0.6;
    notes.forEach(n => {
      document.getElementById(`f-${n.s}-${n.f}`)?.classList.add("active-fret");
      document.getElementById(n.bgId)?.classList.add("tab-active-bg");
      document.getElementById(n.txtId)?.classList.add("tab-active-txt");
      playTone(n.s, n.f, dur);
    });
    document.getElementById("status").textContent = `Звучит: [ ${notes.map(n => `${n.s}:${n.f}`).join(" + ")} ]`;
  }

  cursor++;
  tm = setTimeout(pulse, parseInt(document.getElementById("speed").value));
}

function stop() {
  clearTimeout(tm); tm = null; playing = false; paused = false; cursor = 0;
  clearActive();
  document.getElementById("status").textContent = "Остановлено";
}

document.getElementById("playBtn").onclick = () => {
  if (playing && !paused) return;
  playing = true; paused = false;
  document.getElementById("status").textContent = "Воспроизведение...";
  pulse();
};

document.getElementById("pauseBtn").onclick = () => {
  if (!playing || paused) return;
  clearTimeout(tm); tm = null; paused = true;
  document.getElementById("status").textContent = "Пауза";
};

document.getElementById("stopBtn").onclick = stop;

document.getElementById("loopBtn").onclick = function() {
  loop = !loop;
  this.classList.toggle("active", loop);
  this.textContent = loop ? "🔁 Повтор: Вкл" : "🔁 Повтор: Выкл";
};

document.getElementById("speed").oninput = e => document.getElementById("msVal").textContent = e.target.value;
</script>

</body></html>
